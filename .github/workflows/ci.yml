name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.2"

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # statsbadge's rules, minus the badge builtins: nothing here runs on the badge.
      - name: Lint
        run: uvx --from "ruff>=0.6" ruff check --config ci/ruff.toml src tests

      - run: uv build

      # The prices are half-hour slots priced against whichever tariff covered them, and
      # getting that wrong is a plausible number rather than a failure. The replies are
      # faked, so this reaches no network.
      - name: Test
        run: |
          uv venv /tmp/tests
          uv pip install --python /tmp/tests/bin/python dist/*.whl
          /tmp/tests/bin/python tests/test_octopus.py

      # The entry point is the whole mechanism: a typo in it is a package that installs and
      # provides nothing, and nothing says so.
      - name: Check the entry point is registered
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python --no-deps dist/*.whl
          /tmp/check/bin/python - <<'PY'
          from importlib.metadata import entry_points
          found = {e.name: e.value for e in entry_points(group="statsbadge.sources")}
          assert found.get("octopus") == "statsbadge_octopus:Octopus", found
          print("entry point:", found)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
